name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  config:
    name: Resolve deployment config
    runs-on: ubuntu-latest
    outputs:
      deploy_backend: ${{ steps.resolve.outputs.deploy_backend }}
      deploy_frontend: ${{ steps.resolve.outputs.deploy_frontend }}
    steps:
      - name: Resolve
        id: resolve
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "deploy_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_backend=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set - skipping backend deploy."
          fi
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "deploy_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_frontend=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN secret is not set - skipping frontend deploy."
          fi

  deploy-backend:
    name: Deploy backend (Render)
    runs-on: ubuntu-latest
    needs: [config]
    if: needs.config.outputs.deploy_backend == 'true'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy hook
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy triggered."

      - name: Wait for backend health check
        if: vars.BACKEND_HEALTH_URL != ''
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$BACKEND_HEALTH_URL" | grep -q '"status":"ok"'; then
              echo "Backend is healthy after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Waiting for backend to come up (attempt ${attempt}/30)..."
            sleep 10
          done
          echo "::error::Backend did not become healthy in time."
          exit 1

  deploy-frontend:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [config, deploy-backend]
    if: ${{ !cancelled() && needs.config.outputs.deploy_frontend == 'true' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for production
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Wait for frontend to respond
        if: vars.FRONTEND_URL != ''
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --fail --silent --output /dev/null "$FRONTEND_URL"; then
              echo "Frontend is live after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Waiting for frontend (attempt ${attempt}/20)..."
            sleep 10
          done
          echo "::error::Frontend did not respond in time."
          exit 1

  summary:
    name: Deployment summary
    runs-on: ubuntu-latest
    needs: [config, deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Summary
        run: |
          {
            echo "### Deployment summary"
            echo ""
            echo "- Backend (Render): ${{ needs.deploy-backend.result }}"
            echo "- Frontend (Vercel): ${{ needs.deploy-frontend.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
